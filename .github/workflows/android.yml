name: Android APK

# Compila el APK de Fitit y lo deja como artefacto descargable del run
# (Actions → este workflow → el run → «fitit-apk»). Sólo cuando cambia algo
# que va dentro del APK, o a mano desde la pestaña Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/package.json'
      - '.github/workflows/android.yml'

jobs:
  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Sin setup-android: el runner de ubuntu ya trae el SDK (ANDROID_HOME) y
      # Gradle baja lo que falte. La acción pedía el paquete `tools`, retirado.
      - name: Install deps
        run: npm install
      - name: Build web bundle + sync Android
        run: npm run android:build
      - name: Assemble APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: fitit-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
