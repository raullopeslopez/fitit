name: Android APK

# Compila el APK de Fitit. En un PR pasa los tests nativos y lo deja como
# artefacto del run («fitit-<versión>»). En `main` lo publica como Release, con
# el APK como `fitit-<versión>.apk`, sin zip y sin sesión, **sólo si esa versión
# aún no tiene Release**: un push que no sube la versión (un cambio de la web, de
# CI) no reempaqueta el APK de una versión ya publicada. A mano desde la pestaña
# Actions sí la reemplaza, como salida de emergencia. La última siempre está en:
#   https://github.com/raullopeslopez/fitit/releases/latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/package.json'
      - '.github/workflows/android.yml'

jobs:
  # ¿Hay ya Release de la versión de package.json? En un push a `main`, si la
  # hay, no se compila nada.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: frontend/package.json
          sparse-checkout-cone-mode: false
      - id: read
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./frontend/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "android-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: APK de depuración
    needs: version
    if: github.event_name != 'push' || needs.version.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear la Release y su tag
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Guarda ~/.gradle entre runs: la distribución de Gradle, las dependencias y
      # la caché de build. Sin esto cada run empezaba en frío y se iban ~6 min en
      # bajar y compilar lo mismo que el anterior. Sólo `main` escribe la caché;
      # los PR la leen.
      - uses: gradle/actions/setup-gradle@v4
      # Sin setup-android: el runner de ubuntu ya trae el SDK (ANDROID_HOME) y
      # Gradle baja lo que falte. La acción pedía el paquete `tools`, retirado.
      - name: Install deps
        run: npm ci
      - name: Build web bundle + sync Android
        run: npm run android:build
      # Los tests nativos (JUnit + Robolectric, sin emulador) y el APK, en una sola
      # llamada a Gradle: dos llamadas eran dos arranques y dos configuraciones del
      # proyecto. El hook de pre-commit no pasa los tests nativos porque necesitan
      # el SDK de Android: éste es su sitio. Gradle corre los tests antes de
      # ensamblar y para si fallan, así que un APK roto por dentro no se publica.
      # En el push a `main` sólo se ensambla: es el commit que ya pasó los tests
      # en su PR (ff-only), y la subida de versión siempre toca android/.
      - name: Native unit tests + assemble APK
        working-directory: frontend/android
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            ./gradlew assembleDebug
          else
            ./gradlew testDebugUnitTest assembleDebug
          fi
      # El APK sale siempre con su versión en el nombre (`fitit-0.7.1.apk`): en
      # la carpeta de descargas del teléfono tiene que verse cuál es cuál.
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "fitit-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fitit-${{ steps.apk.outputs.version }}
          path: frontend/fitit-${{ steps.apk.outputs.version }}.apk
          retention-days: 30
      # Una Release por versión (`android-v0.1.1`) con un solo APK, que lleva la
      # versión en el nombre. Ya no hay copia con nombre fijo (`fitit.apk`): el
      # enlace estable es la página de la última Release,
      #   https://github.com/raullopeslopez/fitit/releases/latest
      # En `main` sólo se llega aquí con una versión nueva (job `version`); a mano
      # (workflow_dispatch) se reemplaza el APK de la Release que ya hubiera.
      # Para una Release nueva, sube `version` en package.json (y
      # `versionCode`/`versionName` en android/app/build.gradle).
      - name: Publish Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.apk.outputs.version }}
          tag="android-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "fitit-$version.apk" --clobber
          else
            gh release create "$tag" "fitit-$version.apk" \
              --target "$GITHUB_SHA" \
              --title "Fitit $version para Android" \
              --notes "APK de Fitit $version. Descárgalo desde el móvil e instálalo encima de la versión anterior." \
              --latest
          fi
