name: Android APK

# Compila el APK de Fitit. En un PR lo deja como artefacto del run
# («fitit-<versión>»); en `main`, o a mano desde la pestaña Actions, además lo
# publica como Release, con el APK como `fitit-<versión>.apk`, sin zip y sin
# sesión. La última siempre está en:
#   https://github.com/raullopeslopez/fitit/releases/latest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'frontend/android/**'
      - 'frontend/capacitor.config.json'
      - 'frontend/package.json'
      - '.github/workflows/android.yml'

jobs:
  apk:
    name: APK de depuración
    runs-on: ubuntu-latest
    permissions:
      contents: write # crear la Release y su tag
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # Guarda ~/.gradle entre runs: la distribución de Gradle, las dependencias y
      # la caché de build. Sin esto cada run empezaba en frío y se iban ~6 min en
      # bajar y compilar lo mismo que el anterior. Sólo `main` escribe la caché;
      # los PR la leen.
      - uses: gradle/actions/setup-gradle@v4
      # Sin setup-android: el runner de ubuntu ya trae el SDK (ANDROID_HOME) y
      # Gradle baja lo que falte. La acción pedía el paquete `tools`, retirado.
      - name: Install deps
        run: npm install
      - name: Build web bundle + sync Android
        run: npm run android:build
      # Los tests nativos (JUnit + Robolectric, sin emulador) y el APK, en una sola
      # llamada a Gradle: dos llamadas eran dos arranques y dos configuraciones del
      # proyecto. El hook de pre-commit no pasa los tests nativos porque necesitan
      # el SDK de Android: éste es su sitio. Gradle corre los tests antes de
      # ensamblar y para si fallan, así que un APK roto por dentro no se publica.
      - name: Native unit tests + assemble APK
        working-directory: frontend/android
        run: ./gradlew testDebugUnitTest assembleDebug
      # El APK sale siempre con su versión en el nombre (`fitit-0.7.1.apk`): en
      # la carpeta de descargas del teléfono tiene que verse cuál es cuál.
      - name: Name the APK after its version
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "fitit-$version.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: fitit-${{ steps.apk.outputs.version }}
          path: frontend/fitit-${{ steps.apk.outputs.version }}.apk
          retention-days: 30
      # Una Release por versión (`android-v0.1.1`) con un solo APK, que lleva la
      # versión en el nombre. Ya no hay copia con nombre fijo (`fitit.apk`): el
      # enlace estable es la página de la última Release,
      #   https://github.com/raullopeslopez/fitit/releases/latest
      # Si la versión no ha cambiado se reemplaza el APK de esa misma Release:
      # para una Release nueva, sube `version` en package.json (y
      # `versionCode`/`versionName` en android/app/build.gradle).
      - name: Publish Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.apk.outputs.version }}
          tag="android-v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "fitit-$version.apk" --clobber
          else
            gh release create "$tag" "fitit-$version.apk" \
              --target "$GITHUB_SHA" \
              --title "Fitit $version para Android" \
              --notes "APK de Fitit $version. Descárgalo desde el móvil e instálalo encima de la versión anterior." \
              --latest
          fi
