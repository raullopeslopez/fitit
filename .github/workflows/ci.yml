name: CI

# Sólo en los PR. Se fusiona ff-only, así que lo que llega a `main` es el mismo
# commit que ya pasó aquí: repetirlo en el push no comprobaba nada nuevo.
on:
  pull_request:

jobs:
  # Qué capa tocó el PR. Un job saltado por `if:` cuenta como pasado, así que
  # un PR sólo de Android no espera a Postgres ni a Vitest.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Todas las reglas de un filtro a la vez: «frontend sin android».
          predicate-quantifier: every
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'
              - '!frontend/android/**'
            workflow:
              - '.github/workflows/ci.yml'

  backend:
    name: backend (unit + specs + lint + migrations)
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitit
          POSTGRES_PASSWORD: fitit
          POSTGRES_DB: fitit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install deps
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Migrations (validate against real Postgres)
        env:
          DATABASE_URL: postgresql+asyncpg://fitit:fitit@localhost:5432/fitit
        run: uv run alembic upgrade head
      # Unit y specs en una sola llamada, repartidas entre los núcleos del runner
      # (pytest-xdist): cada test monta su propio SQLite en memoria, así que no
      # comparten nada. Dos llamadas eran dos arranques de los workers.
      - name: Tests (unit + specs Gherkin / pytest-bdd)
        run: uv run python -m pytest -n auto

  frontend:
    name: frontend (tests + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `ci` y no `install`: instala justo el lockfile, sin reescribirlo, y falla
      # si no cuadra con package.json en vez de arreglarlo a escondidas.
      - name: Install deps
        run: npm ci
      - name: Tests (Vitest + Testing Library)
        run: npm test
      - name: Build
        run: npm run build
