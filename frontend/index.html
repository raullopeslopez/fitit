<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `interactive-widget=resizes-content` porque el reparto por defecto de
         Android Chrome (`resizes-visual`) dibuja el teclado *encima* sin
         encoger el viewport de maquetación: nada `fixed` se entera de que hay
         un teclado, así que una hoja anclada abajo se queda debajo de él.
         Medido con el editor abierto a 430×932: `Guardar nombre` en y 723–762
         y el selector de grupo en 770–806, ambos dentro de la banda que tapa
         un IME de ~330 px. El botón que confirma la edición estaba
         literalmente detrás del teclado, y esto es lo que lo saca. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content, viewport-fit=cover"
    />
    <title>Fitit</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- El service worker mira esta marca antes de creerse que una respuesta HTML
         es la app: el plan gratuito de Render contesta al primer GET del día con
         una página suya de "application loading", y sin marca no hay forma de
         distinguirla de nosotros. Si desaparece, sw.js deja de cachear el shell. -->
    <meta name="fitit-shell" content="1" />
    <meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101113" media="(prefers-color-scheme: dark)" />
    <!-- El tema antes del primer pintado, o la app parpadea en claro antes de
         ponerse en oscuro. Repite `applyTheme` de src/theme.js en pequeño
         (misma clave, mismos valores); main.jsx lo vuelve a aplicar al cargar. -->
    <script>
      (function () {
        var pref = null
        try {
          pref = localStorage.getItem('fitit_theme')
        } catch (e) {}
        var dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
    <!-- El SVG lleva la tinta atada al tema (barra de pestañas clara u oscura);
         el PNG es el fallback para quien no lo soporte. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
