<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fitit</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- El service worker mira esta marca antes de creerse que una respuesta HTML
         es la app: el plan gratuito de Render contesta al primer GET del día con
         una página suya de "application loading", y sin marca no hay forma de
         distinguirla de nosotros. Si desaparece, sw.js deja de cachear el shell. -->
    <meta name="fitit-shell" content="1" />
    <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)" />
    <!-- El SVG lleva la tinta atada al tema (barra de pestañas clara u oscura);
         el PNG es el fallback para quien no lo soporte. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
