services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitit
      POSTGRES_PASSWORD: fitit
      POSTGRES_DB: fitit
    ports:
      - "5432:5432"
    volumes:
      - fitit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # DEBUG=1 docker compose up backend -> waits for a debugger (VS Code) to
    # attach on :5678 before serving. Plain `docker compose up` runs as before.
    command: |
      sh -c '
      if [ "$$DEBUG" = "1" ]; then
        exec uv run python -m debugpy --listen 0.0.0.0:5678 --wait-for-client -m uvicorn app.main:app --host 0.0.0.0 --port 8000
      else
        exec uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      fi
      '
    environment:
      ENV: local
      DEBUG: ${DEBUG:-0}
      DATABASE_URL: postgresql+asyncpg://fitit:fitit@db:5432/fitit
      JWT_SECRET: dev-secret-change-me
      AUTH_USERNAME: fitit
      AUTH_PASSWORD: changeme
    ports:
      - "8000:8000"
      - "5678:5678"
    volumes:
      - ./backend:/app
      - /app/.venv          # keep the container's Linux venv, not the host one
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the container's node_modules
    depends_on:
      - backend

volumes:
  fitit_pgdata:
