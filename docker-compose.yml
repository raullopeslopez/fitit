services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fitit
      POSTGRES_PASSWORD: fitit
      POSTGRES_DB: fitit
    ports:
      - "5432:5432"
    volumes:
      - fitit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitit"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://fitit:fitit@db:5432/fitit
      JWT_SECRET: dev-secret-change-me
      AUTH_USERNAME: fitit
      AUTH_PASSWORD: changeme
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv          # keep the container's Linux venv, not the host one
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules   # keep the container's node_modules
    depends_on:
      - backend

volumes:
  fitit_pgdata:
