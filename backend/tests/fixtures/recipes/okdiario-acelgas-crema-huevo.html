18T12:00:53+02:00","description":"Las acelgas a la crema con huevo al horno son ideales para un almuerzo saludable y completo. Esta comida puede servirse como plato principal, el sabor de la acelga se suaviza gracias a la crema y el resto de los ingredientes. Resulta una receta muy sencilla, que gusta a todo el que la prueba. Si se prefiere, es posible lograr el mismo resultado reemplazando la crema de leche por leche descremada o vegetal. El atún también es opcional, aunque puede hacerse cien por cien vegetariana, sin atún. Una elaboración que tiene todo lo que se necesita para alimentarse bien con muy pocos ingredientes.\r\n\r\nEstas acelgas así cocinadas son perfectas para darle glamour a esta verdura que no gusta a todo el mundo. Son ricas en vitaminas, minerales y fibra y su alto contenido en hierro lo hace bueno para combatir la anemia. También son fuente de folatos, excelentes para activar la producción de glóbulos blancos y rojos, además de fortalecer el sistema inmune. Este plato también aporta proteínas de calidad, gracias al huevo, el atún y los piñones. Estos últimos completan el cuadro nutricional sumando Omega 3 y 6, que cuidan la salud cardiovascular.\r\n","keywords":"Recetas verduras","publisher":{"@type":"Organization","name":"okdiario.com","logo":{"@type":"ImageObject","url":"https://okdiario.com/img/logo-okdiario-600x60.png","width":600,"height":60}},"recipeIngredient":["500 gr de acelgas","200 ml de crema de leche","2 huevos","½ cebolla","70 gr de piñones tostados","2 cucharadas de harina","80 gr de atún al natural (opcional)","Queso parmesano","Sal y pimienta Aceite de oliva virgen"],"recipeInstructions":[{"@type":"HowToStep","text":"Blanquear la acelga, sumergiendo las hojas en agua hirviendo con sal durante tres minutos. Escurrir y reservar."},{"@type":"HowToStep","text":"Precalentar el horno a temperatura moderada."},{"@type":"HowToStep","text":"Calentar una sartén con dos cucharadas de aceite."},{"@type":"HowToStep","text":"Cortar la cebolla en juliana fina. Rehogar hasta que se vea transparente."},{"@type":"HowToStep","text":"Agregar la acelga y los piñones."},{"@type":"HowToStep","text":"A continuación, incorporar la harina."},{"@type":"HowToStep","text":"Remover bien para integrar todo."},{"@type":"HowToStep","text":"Verter la crema de leche poco a poco, sin dejar de remover la preparación para que no se formen grumos."},{"@type":"HowToStep","text":"Dejar cocinar durante dos minutos y agregar el atún. Salpimentar al gusto."},{"@type":"HowToStep","text":"Poner la preparación en una fuente refractaria ligeramente aceitada."},{"@type":"HowToStep","text":"Cascar los huevos encima y espolvorear con abundante queso parmesano rallado."},{"@type":"HowToStep","text":"Hornear hasta que la superficie se vea gratinada."},{"@type":"HowToStep","text":"Servir las acelgas a la crema con huevo al horno acompañadas de arroz blanco o patatas asadas."}],"alternativeHeadline":["¿Estás buscando un plato de acelgas que integre nutrientes y un delicioso sabor? Prueba estas acelgas a la crema con huevo al horno."]}]</script>
