[project]
name = "fitit-backend"
version = "0.1.0"
description = "Fitit workout tracker API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=8.1",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.9",
]

[tool.uv]
package = false

[tool.coverage.run]
source = ["app"]
# The endpoints run inside the event loop under Starlette's TestClient — a
# greenlet on a worker thread. Without these, coverage traces only the main
# thread and reports the heavily-specced routers at ~40%, a measurement
# artifact, not a real gap. With them, the true figure shows (~98%).
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Production-only wiring that no unit test exercises: the real DB session (tests
# inject an in-memory override) and the static-file mount (only mounted when a
# built frontend is present). Excluded so the floor reflects testable code.
omit = [
    "app/db.py",
    "app/web.py",
]
show_missing = true
# The suite currently covers 100% of testable code. Hold a floor with a little
# headroom so a genuinely hard-to-reach line doesn't block a commit, while any
# real drop in coverage fails CI. Only enforced when --cov is passed (CI); the
# default `pytest` and the pre-commit hook don't compute coverage.
fail_under = 95

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
# Resolve pytest-bdd .feature paths against this repo, not whatever absolute
# default leaks in from the environment (otherwise collection looks for the
# features under a stale path and errors).
bdd_features_base_dir = "tests/features"

[tool.ruff]
line-length = 100
target-version = "py312"
