[project]
name = "fitit-backend"
version = "0.1.0"
description = "Fitit workout tracker API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-bdd>=8.1",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "aiosqlite>=0.20",
    "ruff>=0.9",
    "debugpy>=1.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
# Resolve pytest-bdd .feature paths against this repo, not whatever absolute
# default leaks in from the environment (otherwise collection looks for the
# features under a stale path and errors).
bdd_features_base_dir = "tests/features"

[tool.coverage.run]
source = ["app"]
# The API endpoints run their DB work inside SQLAlchemy's greenlet context
# (async driven through the TestClient's portal thread). Without these
# concurrency backends coverage never installs its trace hook there, so whole
# endpoint bodies read as "missing" and the total lands ~25 points low — a
# measurement artifact, not a real gap. See tests/README for the true numbers.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10
