databases:
  - name: fitit-db
    plan: free
    databaseName: fitit
    user: fitit

services:
  - type: web
    name: fitit
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # Run migrations before the new version takes traffic.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set these two yourself in the Render dashboard (they are your login).
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
