services:
  - type: web
    name: fitit
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # NOTE: pre-deploy commands need a paid instance type, so on the free plan we
    # run `alembic upgrade head` from the container's start command instead (see
    # the Dockerfile CMD). It's idempotent, so running it on every start is safe.
    envVars:
      - key: ENV
        value: production
      # The database lives on Neon (serverless Postgres), not Render. Set this to
      # your Neon *pooled* connection string in the Render dashboard. config.py
      # coerces it to the asyncpg driver and translates Neon's sslmode/channel_binding
      # query params, so paste the connection string exactly as Neon gives it.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set these two yourself in the Render dashboard. They are not the login
      # any more — everyone registers their own account. The add_users_table
      # migration reads them once to seed the first account on a database that
      # predates the users table.
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      # Google sign-in. The OAuth *web* client id from the Google Cloud console.
      # Unset means the feature is simply off: the button is not rendered and
      # /auth/google refuses every token.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The same id again, for the React build. Two variables and not one
      # because they are consumed at different times — the backend reads its
      # copy at boot, Vite bakes this one into the bundle at build time (see
      # the ARG in ./Dockerfile).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # Read once, by the add_google_sign_in migration, to put an email on the
      # account AUTH_USERNAME seeded — which is what makes the first Google tap
      # open *that* account instead of creating an empty second one. Set it
      # before the deploy that runs the migration or not at all.
      - key: AUTH_EMAIL
        sync: false
