databases:
  - name: fitit-db
    plan: free
    region: frankfurt
    databaseName: fitit
    user: fitit

services:
  - type: web
    name: fitit
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # NOTE: pre-deploy commands need a paid instance type, so on the free plan we
    # run `alembic upgrade head` from the container's start command instead (see
    # the Dockerfile CMD). It's idempotent, so running it on every start is safe.
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set these two yourself in the Render dashboard (they are your login).
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
