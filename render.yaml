services:
  - type: web
    name: fitit
    runtime: docker
    region: frankfurt
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    # NOTE: pre-deploy commands need a paid instance type, so on the free plan we
    # run `alembic upgrade head` from the container's start command instead (see
    # the Dockerfile CMD). It's idempotent, so running it on every start is safe.
    envVars:
      - key: ENV
        value: production
      # The database lives on Neon (serverless Postgres), not Render. Set this to
      # your Neon *pooled* connection string in the Render dashboard. config.py
      # coerces it to the asyncpg driver and translates Neon's sslmode/channel_binding
      # query params, so paste the connection string exactly as Neon gives it.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Set these two yourself in the Render dashboard. They are not the login
      # any more — everyone registers their own account. The add_users_table
      # migration reads them once to seed the first account on a database that
      # predates the users table.
      - key: AUTH_USERNAME
        sync: false
      - key: AUTH_PASSWORD
        sync: false
